name: Daily biostatistics job push

on:
  schedule:
    - cron: "55 21 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-biostatistics-job-push
  cancel-in-progress: false

jobs:
  collect-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
      WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore job history and push queue
        uses: actions/cache@v4
        with:
          path: data/job_history.sqlite3
          key: job-history-${{ github.run_id }}
          restore-keys: |
            job-history-

      - name: Validate push secret
        shell: bash
        run: |
          if [[ -z "${WXPUSHER_SPT}" ]]; then
            echo "::error::Repository secret WXPUSHER_SPT is missing."
            exit 1
          fi

      - name: Collect jobs and build full report
        run: python main.py

      - name: Prepare report files
        shell: bash
        run: |
          mkdir -p action-artifact
          mkdir -p pages-site

          cp output/latest_report.html action-artifact/
          cp output/latest_report.html pages-site/index.html
          touch pages-site/.nojekyll

          latest_json=$(find output -maxdepth 1 -name 'run_report_*.json' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -1 | cut -d' ' -f2-)
          latest_csv=$(find output -maxdepth 1 -name 'jobs_china_*.csv' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -1 | cut -d' ' -f2-)

          [[ -n "${latest_json}" ]] && cp "${latest_json}" action-artifact/
          [[ -n "${latest_csv}" ]] && cp "${latest_csv}" action-artifact/

      - name: Upload latest report backup
        uses: actions/upload-artifact@v4
        with:
          name: job-report-${{ github.run_number }}
          path: action-artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-site

      - name: Deploy full report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send daily WxPusher update
        env:
          REPORT_URL: ${{ steps.deployment.outputs.page_url }}
        run: python main.py --send-daily
